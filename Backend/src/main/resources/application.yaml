spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tardis?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  profiles:
    include: api

app:
  frontend-url: ${FRONTEND_URL:https://tardis-neon.vercel.app}

finnhub:
  api:
    key: ${FINNHUB_API_KEY:}

naver:
  api:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}

freeimage:
  api:
    key: ${FREEIMAGE_API_KEY:}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}


price-alert:
  check-ms: ${PRICE_ALERT_CHECK_MS:300000}
  initial-delay-ms: ${PRICE_ALERT_INITIAL_DELAY_MS:60000}


limit-order:
  check-ms: ${LIMIT_ORDER_CHECK_MS:300000}
  initial-delay-ms: ${LIMIT_ORDER_INITIAL_DELAY_MS:90000}
