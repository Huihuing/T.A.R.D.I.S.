server:
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types:
      - application/json
      - text/html
      - text/plain
      - text/css
      - application/javascript

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tardis?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      initialization-fail-timeout: ${DB_INITIALIZATION_FAIL_TIMEOUT_MS:60000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1500000}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:120000}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    validate-migration-naming: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}
          starttls:
            enable: true
  profiles:
    include: api

app:
  frontend-url: ${FRONTEND_URL:https://tardis-neon.vercel.app}

finnhub:
  api:
    key: ${FINNHUB_API_KEY:}

naver:
  api:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}

freeimage:
  api:
    key: ${FREEIMAGE_API_KEY:}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}


price-alert:
  check-ms: ${PRICE_ALERT_CHECK_MS:300000}
  initial-delay-ms: ${PRICE_ALERT_INITIAL_DELAY_MS:60000}


limit-order:
  check-ms: ${LIMIT_ORDER_CHECK_MS:300000}
  initial-delay-ms: ${LIMIT_ORDER_INITIAL_DELAY_MS:90000}


refresh-token:
  ttl-days: ${REFRESH_TOKEN_TTL_DAYS:30}
  cookie-secure: ${REFRESH_COOKIE_SECURE:true}


admin:
  usernames: ${ADMIN_USERNAMES:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
