# Copy to application-api.yaml for local development.
# application-api.yaml is ignored by Git.

# Optional local database override:
# spring:
#   datasource:
#     url: jdbc:mysql://localhost:3306/tardis?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
#     username: root
#     password: YOUR_LOCAL_DB_PASSWORD

# Local email verification example:
# spring:
#   mail:
#     username: YOUR_GMAIL_ADDRESS
#     password: YOUR_GMAIL_APP_PASSWORD

finnhub:
  api:
    key: YOUR_FINNHUB_API_KEY

naver:
  api:
    client-id: YOUR_NAVER_CLIENT_ID
    client-secret: YOUR_NAVER_CLIENT_SECRET

freeimage:
  api:
    key: YOUR_FREEIMAGE_API_KEY

google:
  # OAuth 2.0 Web Client ID. This is an identifier, not a client secret.
  client-id: YOUR_GOOGLE_OAUTH_CLIENT_ID

jwt:
  secret: CHANGE_ME_TO_A_RANDOM_SECRET_AT_LEAST_32_BYTES
  expiration-ms: 86400000
