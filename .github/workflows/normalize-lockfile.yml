name: Normalize frontend lockfile

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/normalize-lockfile.yml"

permissions:
  contents: write

jobs:
  normalize:
    name: Normalize package-lock.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Regenerate lockfile with npm 11
        working-directory: Frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit normalized lockfile
        shell: bash
        run: |
          if git diff --quiet -- Frontend/package-lock.json; then
            echo "package-lock.json is already normalized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/package-lock.json
          git commit -m "프론트 lockfile 정규화 / Normalize frontend package lock"
          git push
