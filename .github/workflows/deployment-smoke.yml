name: Deployment Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Public deployment smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check frontend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             --retry 6 --retry-all-errors --retry-delay 10             --connect-timeout 10 --max-time 60             https://tardis-neon.vercel.app/ > /dev/null

      - name: Check public board API
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error             --retry 6 --retry-all-errors --retry-delay 10             --connect-timeout 10 --max-time 60             --output /tmp/board.json             --write-out "%{http_code}"             https://t-a-r-d-i-s.onrender.com/api/board/posts)"
          echo "Board API status: $status"
          test "$status" -ge 200
          test "$status" -lt 300

      - name: Check protected API rejects anonymous access
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error             --retry 6 --retry-all-errors --retry-delay 10             --connect-timeout 10 --max-time 60             --output /tmp/protected.json             --write-out "%{http_code}"             https://t-a-r-d-i-s.onrender.com/api/trade/balance)"
          echo "Protected API status: $status"
          if [ "$status" != "401" ]; then
            echo "Expected 401 for anonymous protected API request."
            cat /tmp/protected.json || true
            exit 1
          fi
