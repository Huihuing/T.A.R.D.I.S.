name: PICO World Navigation UI (No DB)
on:
  pull_request:
    paths: ['Frontend/src/pulse-platform/**', 'Frontend/src/main.tsx', 'Frontend/scripts/pulse-navigation*', '.github/workflows/pulse-navigation-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: Frontend
    env:
      PULSE_NAV_WORLD: tardis
      PULSE_NAV_TEST_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.63.0 --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node --experimental-strip-types --test scripts/pulse-navigation.test.mjs
      - run: npm run build
      - name: Native application browser checks
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/pulse-nav-ui.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 2
          done
          node scripts/pulse-navigation-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tardis-pico-navigation
          path: Frontend/test-results/pulse-navigation/
          retention-days: 7
